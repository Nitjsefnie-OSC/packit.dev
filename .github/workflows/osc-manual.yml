name: packit.dev fork CI

# Fork-only exact-ref validation. This file is intentionally not sent upstream.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git branch, tag, or 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: packit-dev-osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Site build gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          repository: Nitjsefnie-OSC/packit.dev
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Report checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"

      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 18
          cache: yarn

      - name: Import the nested docs
        run: make import

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test build website
        run: yarn build
